# Roberts MP-23 remote – Lovelace card (paste via Edit dashboard → Add card → Manual)
# Needs homeassistant/packages/roberts_mp23.yaml loaded. Power/Mute/sources go through the
# helpers so HA's assumed state stays in sync; hold "Radio" to send a raw Radio
# press (toggles DAB/FM when already on radio).
type: vertical-stack
cards:
  - type: tile
    entity: media_player.roberts_mp_23
    name: Roberts MP-23
    icon: mdi:radio
    state_content:
      - state
      - source
    tap_action:
      action: more-info
  - type: grid
    columns: 4
    square: false
    cards:
      - type: button
        name: "Power"
        icon: mdi:power
        show_state: false
        icon_height: 28px
        tap_action:
          action: perform-action
          perform_action: script.roberts_mp23_power_toggle
      - type: button
        name: "Radio"
        icon: mdi:radio
        show_state: false
        icon_height: 28px
        tap_action:
          action: perform-action
          perform_action: input_select.select_option
          target: { entity_id: input_select.roberts_mp23_source }
          data: { option: "Radio" }
        hold_action:
          action: perform-action
          perform_action: script.roberts_mp23_send
          data: { cmd: radio }
      - type: button
        name: "CD"
        icon: mdi:disc
        show_state: false
        icon_height: 28px
        tap_action:
          action: perform-action
          perform_action: input_select.select_option
          target: { entity_id: input_select.roberts_mp23_source }
          data: { option: "CD" }
      - type: button
        name: "SD/USB"
        icon: mdi:usb-flash-drive
        show_state: false
        icon_height: 28px
        tap_action:
          action: perform-action
          perform_action: input_select.select_option
          target: { entity_id: input_select.roberts_mp23_source }
          data: { option: "USB/SD" }
  - type: grid
    columns: 4
    square: false
    cards:
